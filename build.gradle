plugins {
    id 'java'
    id 'scala'
}

group = 'in.algorithms'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.scala-lang:scala-library:2.11.12'
    implementation 'org.scala-lang:scala-compiler:2.11.12'
    implementation 'org.scala-lang.modules:scala-xml_2.11:1.0.6'
    implementation 'org.scala-lang:scala-actors:2.11.12'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        scala {
            srcDirs = ['AlgorithmsProject/src']
        }
        java {
            srcDirs = ['AlgorithmsProject/src']
        }
    }
}

tasks.withType(ScalaCompile) {
    scalaCompileOptions.additionalParameters = ["-deprecation", "-feature"]
}
